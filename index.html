<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F6E56">
<title>街路樹診断システム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--g:#0F6E56;--g-dark:#08403A;--bg:#F4F4F0;--card:#fff;--line:#D8D6CC;--tx:#1c1c1a;--tx2:#6b6a64;
--acc:#185FA5;--acc-bg:#E6F1FB;--ok-bg:#EAF3DE;--ok-tx:#3B6D11;--ng-tx:#A32D2D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
header h1{font-size:17px;margin:0;font-weight:600}
header p{font-size:12px;margin:4px 0 0;opacity:.85}
main{width:100%;max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.cur{border-color:var(--g);border-width:2px}
label.lbl{display:block;font-size:12px;color:var(--tx2);margin:12px 0 5px}
label.lbl:first-child{margin-top:0}
input,select{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx);font-family:inherit}
input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
.rowFlex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:block;width:100%;min-height:50px;font-size:16px;font-weight:600;border:none;border-radius:12px;font-family:inherit;background:var(--g);color:#fff}
.btn:active{background:var(--g-dark)}
.miniBtn{font-size:13px;padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--tx);font-family:inherit;white-space:nowrap}
.miniBtn.pri{border-color:var(--g);color:var(--g);font-weight:600}
.miniBtn.del{color:var(--ng-tx)}
.pname{font-size:16px;font-weight:600;margin:0}
.pmeta{font-size:12px;color:var(--tx2);margin:4px 0 0;line-height:1.6}
.badge{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;background:var(--ok-bg);color:var(--ok-tx);white-space:nowrap}
.stages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stage{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;font-size:13px;background:#fff;color:var(--tx);font-family:inherit;line-height:1.4}
.stage b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.stage.on{border-color:var(--g);color:var(--g)}
.stage.off{opacity:.5}
.stage small{color:var(--tx2);font-size:11px}
details{margin-bottom:12px}
summary{font-size:14px;font-weight:600;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
details[open] summary{border-radius:14px 14px 0 0;border-bottom:none}
details .card{border-radius:0 0 14px 14px;margin-bottom:0;border-top:none}
.note{font-size:12px;color:var(--tx2);margin:6px 0 0;line-height:1.6}
.empty{text-align:center;color:var(--tx2);font-size:14px;padding:24px 12px;line-height:1.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;bottom:16px;left:12px;right:12px;max-width:640px;margin:0 auto;background:var(--g-dark);color:#fff;font-size:14px;padding:12px 16px;border-radius:12px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>街路樹診断システム</h1>
  <p>案件を選んでから現場アプリを開いてください</p>
</header>
<main>
  <div id="list"></div>

  <details id="newPanel">
    <summary>＋ 新しい案件を登録</summary>
    <div class="card">
      <label class="lbl">案件の表示名</label>
      <input id="f_name" placeholder="例）R8 茨木土木 街路樹診断">
      <label class="lbl">業務種別</label>
      <select id="f_kind">
        <option value="街路樹診断">街路樹診断</option>
        <option value="公園危険木調査">公園危険木調査</option>
      </select>
      <div class="grid2">
        <div>
          <label class="lbl">発注事務所</label>
          <input id="f_office" placeholder="例）茨木土木事務所">
        </div>
        <div>
          <label class="lbl">年度</label>
          <input id="f_year" placeholder="例）R8">
        </div>
      </div>
      <label class="lbl">正式業務名（黒板・帳票に使用）</label>
      <input id="f_koji" placeholder="例）主要地方道 八尾茨木線外 街路樹診断業務（R8 茨木土木事務所）">
      <label class="lbl">点検者</label>
      <input id="f_inspector" placeholder="例）三宅 智（樹木医番号1105）">
      <label class="lbl">特記仕様書の用語（事務所により呼び方が異なります）</label>
      <select id="f_terms"></select>
      <p class="note">特記仕様書が「簡易診断・初期診断・精密診断」と書かれている事務所ではBを選んでください。画面表示と帳票の名称が切り替わります。</p>
      <button id="saveBtn" class="btn" style="margin-top:14px">この案件を登録</button>
      <button id="cancelBtn" class="miniBtn" style="width:100%;margin-top:8px;display:none;min-height:42px">編集をやめる</button>
    </div>
  </details>

  <details>
    <summary>事務所PCとのデータ受け渡し</summary>
    <div class="card">
      <div class="grid2">
        <button id="expBtn" class="miniBtn pri" style="min-height:44px">案件を書き出す</button>
        <button id="impBtn" class="miniBtn" style="min-height:44px">案件を取り込む</button>
      </div>
      <input type="file" id="impFile" accept=".json" style="display:none">
      <p class="note">事務所PCの統合ハブで作った案件ファイル（案件.json）を取り込めます。書き出したファイルはハブ側で読み込めます。</p>
    </div>
  </details>

  <details>
    <summary>アプリの更新・不具合のとき</summary>
    <div class="card">
      <p id="verInfo" class="note" style="margin-top:0"></p>
      <button id="updBtn" class="miniBtn pri" style="width:100%;min-height:44px;margin-top:8px">最新版に更新する</button>
      <p class="note">画面がおかしいときや「〜is not a function」のようなエラーが出るときに押してください。
        保存済みの案件・点検データは消えません。</p>
    </div>
  </details>
</main>
<div id="toast" class="toast"></div>

<script src="common/project.js"></script>
<script>
const $ = id => document.getElementById(id);
let editingId = null;

/* 古い common/project.js がキャッシュに残っていても画面が止まらないようにする */
function routeNamesOf(p){
  try{
    if(typeof SysProject.routeNames === "function") return SysProject.routeNames(p);
  }catch(e){}
  return ((p && p.routes) || [])
    .map(r => typeof r === "string" ? r : (r && r.name) || "")
    .filter(Boolean);
}

(function initTerms(){
  const sel = $("f_terms");
  Object.values(SysProject.TERM_PRESETS).forEach(t=>{
    const o = document.createElement("option");
    o.value = t.key; o.textContent = t.key + "：" + t.label;
    sel.appendChild(o);
  });
})();

function render(){
  const list = SysProject.all();
  const cur = SysProject.current();
  const box = $("list");
  box.innerHTML = "";
  if(!list.length){
    box.innerHTML = '<div class="card"><div class="empty">案件がまだありません。<br>下の「＋ 新しい案件を登録」から始めてください。</div></div>';
    return;
  }
  list.slice().sort((a,b)=>(b.created||0)-(a.created||0)).forEach(p=>{
    const t = SysProject.terms(p);
    const isCur = cur && cur.id === p.id;
    const card = document.createElement("div");
    card.className = "card" + (isCur ? " cur" : "");
    const meta = [p.office, p.year, p.kind].filter(Boolean).join("　");
    const rs = routeNamesOf(p);
    const rtxt = rs.length
      ? '<br>路線：' + SysProject.esc(rs.slice(0, 3).join("、")) + (rs.length > 3 ? "　ほか" + (rs.length - 3) + "路線" : "")
      : "";
    card.innerHTML =
      '<div class="rowFlex"><p class="pname">' + SysProject.esc(p.name) + '</p>' +
      (isCur ? '<span class="badge">選択中</span>' : '') + '</div>' +
      '<p class="pmeta">' + SysProject.esc(meta) +
      (p.inspector ? '<br>点検者：' + SysProject.esc(p.inspector) : '') + rtxt + '</p>';

    const stages = document.createElement("div");
    stages.className = "stages";
    const park = p.kind === "公園危険木調査";
    [[t.s1,"tenken/",true],[t.s2,"gaikan/",!park],[t.s3,null,false]].forEach(([label,href,enabled])=>{
      const b = document.createElement("button");
      b.className = "stage " + (enabled ? "on" : "off");
      b.innerHTML = "<b>" + SysProject.esc(label) + "</b><small>" +
        (href && enabled ? "現場入力" : (href ? "準備中" : "事務所PCで実施")) + "</small>";
      b.onclick = ()=>{
        if(!enabled){ toast(href ? "公園危険木調査の" + label + "は準備中です" : label + "は事務所PCの統合ハブで行います"); return; }
        SysProject.setCurrent(p.id);
        location.href = href;
      };
      stages.appendChild(b);
    });
    card.appendChild(stages);

    const row = document.createElement("div");
    row.className = "rowFlex";
    row.style.marginTop = "12px";
    const left = document.createElement("div");
    if(!isCur){
      const sb = document.createElement("button");
      sb.className = "miniBtn pri"; sb.textContent = "この案件を選択";
      sb.onclick = ()=>{ SysProject.setCurrent(p.id); render(); toast(p.name + " に切り替えました"); };
      left.appendChild(sb);
    }
    const right = document.createElement("div");
    right.style.cssText = "display:flex;gap:6px";
    const eb = document.createElement("button");
    eb.className = "miniBtn"; eb.textContent = "編集";
    eb.onclick = ()=> startEdit(p);
    const db = document.createElement("button");
    db.className = "miniBtn del"; db.textContent = "削除";
    db.onclick = ()=>{
      if(!confirm(p.name + " を一覧から削除しますか？")) return;
      if(!confirm("本当に削除しますか？\n（現場アプリに入力済みの点検データ自体は消えません）")) return;
      SysProject.remove(p.id); render(); toast("削除しました");
    };
    right.appendChild(eb); right.appendChild(db);
    row.appendChild(left); row.appendChild(right);
    card.appendChild(row);
    box.appendChild(card);
  });
}

function startEdit(p){
  editingId = p.id;
  $("f_name").value = p.name || ""; $("f_kind").value = p.kind || "街路樹診断";
  $("f_office").value = p.office || ""; $("f_year").value = p.year || "";
  $("f_koji").value = p.koji || ""; $("f_inspector").value = p.inspector || "";
  $("f_terms").value = p.termPreset || "A";
  $("newPanel").open = true;
  $("saveBtn").textContent = "変更を保存";
  $("cancelBtn").style.display = "block";
  $("newPanel").scrollIntoView({behavior:"smooth", block:"start"});
}
function endEdit(){
  editingId = null;
  ["f_name","f_office","f_year","f_koji","f_inspector"].forEach(id => $(id).value = "");
  $("f_kind").value = "街路樹診断"; $("f_terms").value = "A";
  $("saveBtn").textContent = "この案件を登録";
  $("cancelBtn").style.display = "none";
}
$("cancelBtn").onclick = ()=>{ endEdit(); $("newPanel").open = false; };

$("saveBtn").onclick = ()=>{
  const name = $("f_name").value.trim();
  if(!name){ toast("案件の表示名を入力してください"); return; }
  const preset = $("f_terms").value;
  const t = SysProject.TERM_PRESETS[preset];
  const p = {
    id: editingId || null,
    name,
    kind: $("f_kind").value,
    office: $("f_office").value.trim(),
    year: $("f_year").value.trim(),
    koji: $("f_koji").value.trim(),
    inspector: $("f_inspector").value.trim(),
    termPreset: preset,
    terms: {s1:t.s1, s2:t.s2, s3:t.s3}
  };
  if(editingId){
    const old = SysProject.all().find(x => x.id === editingId);
    if(old) p.created = old.created;
  }
  const saved = SysProject.upsert(p);
  if(!SysProject.current()) SysProject.setCurrent(saved.id);
  endEdit();
  $("newPanel").open = false;
  render();
  toast("保存しました");
};

$("expBtn").onclick = ()=>{
  if(!SysProject.all().length){ toast("書き出す案件がありません"); return; }
  const blob = new Blob([SysProject.exportJson()], {type:"application/json"});
  const fname = "案件_" + new Date().toISOString().slice(0,10).replace(/-/g,"") + ".json";
  const file = new File([blob], fname, {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:fname}).catch(()=>dl(blob, fname));
  } else dl(blob, fname);
};
function dl(blob, fname){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
$("impBtn").onclick = ()=> $("impFile").click();
$("impFile").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const n = SysProject.importJson(await f.text());
    render(); toast(n + " 件の案件を取り込みました");
  }catch(err){ toast("取込に失敗しました：" + err.message); }
  e.target.value = "";
});

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

const APP_VER = 7;   // index.html を直したら1つ増やす
$("verInfo").textContent =
  "画面 v" + APP_VER + "　／　共通部品 v" + (SysProject.VERSION || "1（古い版）") +
  (SysProject.VERSION === APP_VER ? "" : "　※食い違っています。下のボタンで更新してください");

$("updBtn").onclick = async ()=>{
  $("updBtn").disabled = true;
  toast("更新しています…");
  try{
    if("caches" in window){
      for(const k of await caches.keys()) await caches.delete(k);
    }
    if("serviceWorker" in navigator){
      for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    }
  }catch(e){ console.warn(e); }
  location.reload(true);
};

render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js"); }
</script>
</body>
</html>
